name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Crear proyecto Capacitor
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          echo '<html><body>Cargando...</body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nutrisnap.app",
            "appName": "NutriSnap",
            "webDir": "www",
            "server": {
              "url": "https://nutrisnap-ai-4667.ai.studio/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriSnap-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
